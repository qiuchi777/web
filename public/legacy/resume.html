<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人简历</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #eaf4ff;
        }
        .wrap {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #9ca3af;
            border-radius: 12px;
            padding: 18px 20px;
        }

        .box-container {
            margin-top: 10px;
        }

        .box-container::after {
            content: "";
            display: table;
            clear: both;
        }

        .box {
            float: left;
            width: 48%;
            margin: 1%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f8fbff;
            min-height: 110px;
        }

        .box h2 {
            margin: 0 0 8px;
            font-size: 1.05rem;
            text-align: center;
            color: #1f2937;
        }

        .box p {
            margin: 0;
            color: #374151;
            line-height: 1.5;
        }

        @media (max-width: 520px) {
            .box {
                float: none;
                width: 100%;
                margin: 0 0 12px;
            }
        }
        h1 { margin: 0 0 12px; text-align: center; }

        .hero-img {
            display: block;
            max-width: 180px;
            width: 100%;
            height: auto;
            margin: 0 auto 12px;
            border-radius: 10px;
        }
        .back-link-wrap { text-align: center; }
        a { color: #2c70ff; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>个人简历</h1>
        <img class="hero-img" src="1.jpg" alt="个人简历图片" />

        <div class="box-container">
            <section class="box">
                <h2>基本信息</h2>
                <p>姓名；李文彬
                <br />年龄：20
                <br />学校：中南林业科技大学</p>
            </section>
            <section class="box">
                <h2>联系方式</h2>
                <p>电话：18692028156                   
                <br />邮箱：lwb013x@gmail.com
                <br />地址：湖南省长沙市</p>
            </section>
            <section class="box">
                <h2>兴趣爱好</h2>
                <p>网络游戏
                <br />篮球
                <br />听歌</p>
            </section>
            <section class="box">
                <h2>技能</h2>
                <p>
                <br />负责内容：
                <br />成果说明：</p>
            </section>
        </div>

        <p class="back-link-wrap"><a href="main.html">返回主界面</a></p>
    </div>
</body>
</html>
