<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的理想</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: clamp(16px, 3vw, 28px);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(145deg, #eaf4ff, #d9ebff);
            color: #1f2937;
        }
        .wrap {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 18px;
            padding: clamp(18px, 3vw, 28px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        .hero {
            border-radius: 14px;
            background: linear-gradient(120deg, #2c70ff, #5ba4ff);
            color: #fff;
            padding: 18px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(1.4rem, 3.2vw, 2rem);
            letter-spacing: 0.02em;
        }
        .subtitle {
            margin: 8px 0 0;
            text-align: center;
            opacity: 0.92;
        }
        .ideal-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }
        .ideal-item {
            background: #f8fbff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 600;
        }
        .ideal-item::before {
            content: "✨ ";
        }
        .back-wrap {
            margin-top: 18px;
            display: flex;
            justify-content: center;
        }
        .back-link {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            background: #eff6ff;
            text-decoration: none;
            font-weight: 700;
        }
        .back-link:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <section class="hero">
            <h1>我的理想</h1>
            <p class="subtitle">一步一步，把热爱变成现实</p>
        </section>

        <ul class="ideal-list">
            <li class="ideal-item">去五台山完成一次徒步</li>
            <li class="ideal-item">成为一名三角洲高手</li>
            <li class="ideal-item">学会吉他</li>
        </ul>

        <div class="back-wrap">
            <a class="back-link" href="main.html">返回主界面</a>
        </div>
    </div>
</body>
</html>
